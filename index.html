<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЛОГИЧЕСКИЙ ТЕСТ // ПРОТОКОЛ</title>
    <style>
        :root {
            --bg: #080808;
            --text: #e0e0e0;
            --accent: #00ff66;
            --dim: #666666;
            --error: #ff3b30;
            --border: #222222;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'SF Mono', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .terminal {
            width: 100%;
            max-width: 700px;
            border: 1px solid var(--border);
            background: #0d0d0d;
            padding: 28px;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--dim);
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1a1a1a;
            margin-bottom: 24px;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stage-title {
            color: var(--accent);
            font-size: 17px;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .question-text {
            line-height: 1.65;
            font-size: 16px;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .task-box {
            background: #141414;
            border-left: 3px solid var(--accent);
            padding: 16px;
            margin: 18px 0;
            font-size: 16px;
            color: #ffffff;
            line-height: 1.5;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        input[type="text"] {
            flex: 1;
            background: #050505;
            border: 1px solid #333;
            color: var(--accent);
            font-family: inherit;
            font-size: 17px;
            padding: 14px;
            outline: none;
            text-transform: uppercase;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px 22px;
            font-family: inherit;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active { opacity: 0.8; }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            gap: 10px;
        }
        .secondary-btn {
            background: transparent;
            color: var(--dim);
            border: 1px solid #222;
            padding: 8px 14px;
            font-size: 13px;
        }
        .hint-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #111;
            color: #aaa;
            font-size: 14px;
            border: 1px dashed #333;
        }
        .error-msg {
            color: var(--error);
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }
        .result-card {
            border: 1px solid var(--accent);
            padding: 24px;
            margin-top: 20px;
            background: #0a0f0c;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
            text-align: left;
        }
        .stat-item {
            background: #121212;
            padding: 12px;
            border: 1px solid #222;
        }
        .stat-label { font-size: 12px; color: #777; }
        .stat-val { font-size: 20px; color: #fff; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <div id="step-counter">ВОПРОС 1 / 7</div>
        <div id="timer">00:00</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div id="game-area">
        <div class="stage-title" id="stage-title">Загрузка...</div>
        <div class="question-text" id="stage-text"></div>
        <div class="task-box" id="stage-task"></div>

        <div class="input-group">
            <input type="text" id="answer-input" placeholder="ВВЕДИТЕ ОТВЕТ..." autocomplete="off">
            <button onclick="checkAnswer()">ДАЛЕЕ →</button>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="controls-row">
            <button class="secondary-btn" onclick="toggleHint()">[ ? ] ПОДСКАЗКА</button>
            <button class="secondary-btn" onclick="skipQuestion()">ПРОПУСТИТЬ ВОПРОС »</button>
        </div>
        <div class="hint-box" id="hint-box"></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzP6PEgoLG4SX9CyF4sJHtifAM2-hRL8puWnaKUG0dhUCmFBCN9sjk9PWAi8XV0cMee/exec";

    // 7 логических вопросов (ответы в массиве — поддерживается несколько вариантов написания)
    const QUESTIONS = [
        {
            title: "01 // ЧИСЛОВАЯ ЗАКОНОМЕРНОСТЬ",
            text: "Определите следующее число в последовательности:",
            task: "2,  6,  12,  20,  30,  ?",
            answers: ["42"],
            hint: "Посмотрите на разницу между соседними числами: +4, +6, +8, +10..."
        },
        {
            title: "02 // КЛАССИЧЕСКАЯ ЛОГИКА",
            text: "Внимательно прочитайте условие:",
            task: "Улитка ползёт вверх по столбу высотой 10 метров. За день она поднимается на 3 метра, а за ночь сползает вниз на 2 метра. На какой по счёту день улитка впервые достигнет вершины столба?",
            answers: ["8", "ВОСЬМОЙ", "НА 8", "8 ДЕНЬ"],
            hint: "После 7 суток она будет на высоте 7 метров. Сколько ей останется проползти на 8-й день?"
        },
        {
            title: "03 // РЫЦАРИ И ЛЖЕЦЫ",
            text: "Рыцари всегда говорят правду, а лжецы всегда лгут. Вы встретили двух жителей острова — А и Б.",
            task: "А сказал: «Мы оба с Б — лжецы».\nКто из них кто? (Напишите два слова через пробел, например: ЛЖЕЦ РЫЦАРЬ)",
            answers: ["ЛЖЕЦ РЫЦАРЬ", "ЛЖЕЦ И РЫЦАРЬ"],
            hint: "Может ли рыцарь назвать себя лжецом? А если А лжёт, значит фраза «мы оба лжецы» — ложь."
        },
        {
            title: "04 // ЛОГИКА СЛОВ",
            text: "Найдите закономерность в ряду букв и укажите следующую:",
            task: "О,  Д,  Т,  Ч,  П,  Ш,  С,  ?",
            answers: ["В"],
            hint: "Это первые буквы слов: Один, Два, Три, Четыре..."
        },
        {
            title: "05 // ВЗВЕШИВАНИЕ",
            text: "Задача на поиск минимального числа действий:",
            task: "Есть 9 внешне одинаковых монет, но одна из них фальшивая (она легче остальных). Какое минимальное количество взвешиваний на чашечных весах без гирь потребуется, чтобы гарантированно найти фальшивую монету?",
            answers: ["2", "ДВА"],
            hint: "Разделите монеты на три кучки по 3 штуки."
        },
        {
            title: "06 // ЧАСЫ И УГЛЫ",
            text: "Пространственное мышление:",
            task: "Часы показывают ровно 3:15. Чему равен угол (в градусах) между часовой и минутной стрелками? (Введите только число, возможно дробное через точку)",
            answers: ["7.5", "7,5"],
            hint: "Минутная стрелка стоит ровно на тройке, но часовая за 15 минут прошла четверть пути от 3 до 4 (1/4 от 30 градусов)."
        },
        {
            title: "07 // ФИНАЛЬНЫЙ ШИФР",
            text: "Используйте логику и алфавит:",
            task: "Если КОД = 12-16-5, то чему равно слово УМ? (Запишите числа через дефис)",
            answers: ["21-14"],
            hint: "Каждой букве соответствует её порядковый номер в русском алфавите (К=12, О=16, Д=5)."
        }
    ];

    let currentStep = parseInt(localStorage.getItem("lq_step")) || 0;
    let solvedCount = parseInt(localStorage.getItem("lq_solved")) || 0;
    let wrongAttempts = parseInt(localStorage.getItem("lq_wrong")) || 0;
    let hintsUsed = parseInt(localStorage.getItem("lq_hints")) || 0;
    let startTime = parseInt(localStorage.getItem("lq_start")) || Date.now();
    let playerId = localStorage.getItem("lq_id") || ("USER-" + Math.floor(1000 + Math.random() * 9000));

    localStorage.setItem("lq_start", startTime);
    localStorage.setItem("lq_id", playerId);

    function sendStats(eventName) {
        if (!GOOGLE_SCRIPT_URL) return;
        const timeMins = ((Date.now() - startTime) / 60000).toFixed(1);
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                playerId: playerId,
                stage: currentStep + 1,
                event: eventName,
                timeMins: timeMins,
                hints: hintsUsed
            })
        }).catch(() => {});
    }

    if (!localStorage.getItem("lq_started")) {
        sendStats("TEST_START");
        localStorage.setItem("lq_started", "1");
    }

    setInterval(() => {
        if (currentStep >= QUESTIONS.length) return;
        const diff = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
        const secs = String(diff % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `${mins}:${secs}`;
    }, 1000);

    function getRank(score, total) {
        const ratio = score / total;
        if (ratio === 1 && hintsUsed === 0) return "АБСОЛЮТНЫЙ АНАЛИТИК (S-РАНГ)";
        if (ratio >= 0.85) return "ВЫСОКИЙ ИНТЕЛЛЕКТ (A-РАНГ)";
        if (ratio >= 0.55) return "ЛОГИК-ПРАКТИК (B-РАНГ)";
        return "НАЧИНАЮЩИЙ ИССЛЕДОВАТЕЛЬ (C-РАНГ)";
    }

    function renderStep() {
        const progressPercent = (currentStep / QUESTIONS.length) * 100;
        document.getElementById("progress-fill").style.width = `${progressPercent}%`;

        if (currentStep >= QUESTIONS.length) {
            const totalMins = ((Date.now() - startTime) / 60000).toFixed(1);
            const rank = getRank(solvedCount, QUESTIONS.length);
            document.getElementById("step-counter").innerText = "ТЕСТ ЗАВЕРШЁН";

            document.getElementById("game-area").innerHTML = `
                <div class="stage-title">РЕЗУЛЬТАТЫ ТЕСТИРОВАНИЯ</div>
                <div class="result-card">
                    <div style="color:#888; font-size:12px;">ПРИСВОЕННЫЙ РАНГ</div>
                    <div style="font-size:20px; color:#00ff66; font-weight:bold; margin:8px 0 16px 0;">${rank}</div>

                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-label">РЕШЕНО ЗАДАЧ</div>
                            <div class="stat-val">${solvedCount} из ${QUESTIONS.length}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">ЗАТРАЧЕНО ВРЕМЕНИ</div>
                            <div class="stat-val">${totalMins} мин.</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">ОШИБОЧНЫХ ПОПЫТОК</div>
                            <div class="stat-val">${wrongAttempts}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">ПОДСКАЗОК</div>
                            <div class="stat-val">${hintsUsed}</div>
                        </div>
                    </div>

                    <div style="font-size:13px; color:#666; text-align:center;">ID сессии: ${playerId}</div>
                </div>

                <button class="secondary-btn" style="margin-top:20px; width:100%;" onclick="resetTest()">[ ПРОЙТИ ЗАНОВО ]</button>
            `;
            return;
        }

        const q = QUESTIONS[currentStep];
        document.getElementById("step-counter").innerText = `ВОПРОС ${currentStep + 1} / ${QUESTIONS.length}`;
        document.getElementById("stage-title").innerText = q.title;
        document.getElementById("stage-text").innerText = q.text;
        document.getElementById("stage-task").innerText = q.task;
        document.getElementById("hint-box").innerText = q.hint;
        document.getElementById("hint-box").style.display = "none";
        document.getElementById("answer-input").value = "";
        document.getElementById("error-msg").innerText = "";
    }

    function checkAnswer() {
        const input = document.getElementById("answer-input").value.trim().toUpperCase();
        if (!input) return;

        const validAnswers = QUESTIONS[currentStep].answers.map(a => a.toUpperCase());

        if (validAnswers.includes(input)) {
            solvedCount++;
            localStorage.setItem("lq_solved", solvedCount);
            sendStats("SOLVED");
            nextStep();
        } else {
            wrongAttempts++;
            localStorage.setItem("lq_wrong", wrongAttempts);
            sendStats("WRONG: " + input);
            document.getElementById("error-msg").innerText = "[ НЕВЕРНО ] — Попробуйте ещё раз или возьмите подсказку.";
        }
    }

    function skipQuestion() {
        sendStats("SKIPPED");
        nextStep();
    }

    function nextStep() {
        currentStep++;
        localStorage.setItem("lq_step", currentStep);
        if (currentStep >= QUESTIONS.length) {
            sendStats(`FINISHED (${solvedCount}/${QUESTIONS.length})`);
        }
        renderStep();
    }

    function toggleHint() {
        const box = document.getElementById("hint-box");
        if (box.style.display === "none") {
            box.style.display = "block";
            hintsUsed++;
            localStorage.setItem("lq_hints", hintsUsed);
            sendStats("HINT_USED");
        }
    }

    function resetTest() {
        localStorage.clear();
        location.reload();
    }

    document.getElementById("answer-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") checkAnswer();
    });

    renderStep();
</script>

</body>
</html>
