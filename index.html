<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LogicArena — Интерактивная викторина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-purple: #46178f;
            --bg-dark: #25076b;
            --red: #e21b3c;
            --red-shadow: #990f26;
            --blue: #1368ce;
            --blue-shadow: #0b4182;
            --yellow: #d89e00;
            --yellow-shadow: #966d00;
            --green: #26890c;
            --green-shadow: #175406;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top, #5e22b8 0%, var(--bg-purple) 55%, var(--bg-dark) 100%);
            color: #ffffff;
        }

        /* Декоративные фигуры на фоне */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
            opacity: 0.12;
        }
        .bg-shapes span {
            position: absolute;
            font-size: 160px;
            font-weight: 900;
        }
        .bg-shapes span:nth-child(1) { top: -30px; left: -20px; transform: rotate(-15deg); }
        .bg-shapes span:nth-child(2) { bottom: 10%; right: -20px; transform: rotate(20deg); }
        .bg-shapes span:nth-child(3) { top: 45%; left: 8%; font-size: 110px; }

        /* Общий контейнер на весь экран */
        .screen {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 24px 24px 24px;
        }

        /* Стартовый экран */
        .start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 24px;
        }
        .logo-title {
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 6px 0 rgba(0,0,0,0.25);
            margin: 0;
        }
        .logo-sub {
            font-size: clamp(16px, 2.5vw, 22px);
            opacity: 0.9;
            max-width: 600px;
            margin: 0;
            font-weight: 600;
        }
        .nick-input {
            width: 100%;
            max-width: 380px;
            padding: 18px 22px;
            font-size: 20px;
            font-weight: 800;
            font-family: inherit;
            text-align: center;
            border: none;
            border-radius: 16px;
            background: #fff;
            color: #1e293b;
            box-shadow: 0 8px 0 rgba(0,0,0,0.25);
            outline: none;
        }
        .btn-start {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            font-size: 22px;
            font-weight: 900;
            font-family: inherit;
            text-transform: uppercase;
            background: #26890c;
            color: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 7px 0 #175406;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-start:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #175406;
        }

        /* Верхняя панель во время игры */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .hud-pill {
            background: rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 800;
            font-size: clamp(14px, 2vw, 17px);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .streak-badge {
            background: linear-gradient(135deg, #ff6b00, #ff2a00);
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 72, 0, 0.5);
            transition: transform 0.2s;
        }

        /* Полоса таймера */
        .timer-bar-wrap {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            overflow: hidden;
            margin: 12px 0;
        }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: #00f5d4;
            transition: width 0.1s linear, background-color 0.3s;
        }

        /* Центральная карточка вопроса */
        .question-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 8px 0 18px 0;
        }
        .question-card {
            width: 100%;
            max-width: 960px;
            height: 100%;
            max-height: 360px;
            background: #ffffff;
            color: #1e1b4b;
            border-radius: 24px;
            padding: clamp(20px, 4vw, 36px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 12px 0 rgba(0,0,0,0.22);
            position: relative;
        }
        .q-category {
            position: absolute;
            top: -14px;
            background: #ffbe0b;
            color: #1e1b4b;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 999px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }
        .q-text {
            font-size: clamp(20px, 3.2vw, 32px);
            font-weight: 800;
            line-height: 1.35;
            margin: 0;
            white-space: pre-line;
        }

        /* Сетка 4 кнопок как в Kahoot */
        .answers-grid {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            height: 38%;
            min-height: 190px;
        }
        .ans-btn {
            border: none;
            border-radius: 18px;
            color: #ffffff;
            font-family: inherit;
            font-size: clamp(17px, 2.5vw, 24px);
            font-weight: 800;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.15s;
        }
        .ans-btn:active {
            transform: translateY(5px);
        }
        .ans-btn.red { background: var(--red); box-shadow: 0 7px 0 var(--red-shadow); }
        .ans-btn.blue { background: var(--blue); box-shadow: 0 7px 0 var(--blue-shadow); }
        .ans-btn.yellow { background: var(--yellow); box-shadow: 0 7px 0 var(--yellow-shadow); }
        .ans-btn.green { background: var(--green); box-shadow: 0 7px 0 var(--green-shadow); }

        .shape-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            background: rgba(0,0,0,0.18);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        /* Полноэкранный оверлей ответа (Верно / Неверно) */
        .feedback-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 28px;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .feedback-overlay.correct { background: #26890c; }
        .feedback-overlay.wrong { background: #e21b3c; }
        .fb-icon {
            font-size: 76px;
            margin-bottom: 10px;
        }
        .fb-title {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 900;
            margin: 0 0 12px 0;
        }
        .fb-points {
            background: rgba(0,0,0,0.25);
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 18px;
        }
        .fb-explain {
            max-width: 640px;
            font-size: 18px;
            line-height: 1.5;
            background: rgba(255,255,255,0.15);
            padding: 18px 24px;
            border-radius: 18px;
            margin-bottom: 28px;
        }
        .btn-next {
            background: #ffffff;
            color: #1e1b4b;
            border: none;
            border-radius: 16px;
            padding: 18px 42px;
            font-family: inherit;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 7px 0 rgba(0,0,0,0.25);
            cursor: pointer;
        }

        /* Финальный экран подиума */
        .podium-screen {
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .podium-card {
            background: #ffffff;
            color: #1e1b4b;
            border-radius: 28px;
            padding: clamp(24px, 4vw, 40px);
            width: 100%;
            max-width: 680px;
            box-shadow: 0 14px 0 rgba(0,0,0,0.25);
        }
        .final-score {
            font-size: clamp(44px, 7vw, 68px);
            font-weight: 900;
            color: var(--bg-purple);
            margin: 8px 0;
        }
        .final-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 24px 0;
        }
        .f-box {
            background: #f1f5f9;
            padding: 16px 10px;
            border-radius: 16px;
        }
        .f-val {
            font-size: 24px;
            font-weight: 900;
            color: #0f172a;
        }
        .f-lbl {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            margin-top: 4px;
        }

        @media (max-width: 640px) {
            .answers-grid {
                grid-template-columns: 1fr;
                height: auto;
                gap: 10px;
            }
            .ans-btn { padding: 14px 16px; }
            .final-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="bg-shapes">
    <span>▲</span>
    <span>◆</span>
    <span>●</span>
</div>

<!-- 1. СТАРТОВЫЙ ЭКРАН -->
<div class="screen start-screen" id="start-screen">
    <div style="font-size: 64px;">⚡</div>
    <h1 class="logo-title">LOGIC ARENA</h1>
    <p class="logo-sub">Отвечай быстро и точно! Чем быстрее правильный ответ — тем больше очков и выше множитель серии.</p>
    <input type="text" class="nick-input" id="player-name" placeholder="Введи своё имя..." maxlength="18">
    <button class="btn-start" onclick="startGame()">Поехали! 🚀</button>
</div>

<!-- 2. ИГРОВОЙ ЭКРАН НА ВЕСЬ ЭКРАН -->
<div class="screen" id="game-screen" style="display: none;">
    <div>
        <div class="hud">
            <div class="hud-pill" id="hud-step">1 / 7</div>
            <div class="streak-badge" id="hud-streak" style="opacity: 0;">🔥 Серия: 0</div>
            <div class="hud-pill" id="hud-score">🏆 0</div>
        </div>
        <div class="timer-bar-wrap">
            <div class="timer-bar-fill" id="timer-bar"></div>
        </div>
    </div>

    <div class="question-stage">
        <div class="question-card">
            <div class="q-category" id="q-category">Категория</div>
            <p class="q-text" id="q-text">Текст вопроса</p>
        </div>
    </div>

    <div class="answers-grid">
        <button class="ans-btn red" onclick="selectAnswer(0)">
            <div class="shape-icon">▲</div>
            <span id="opt-0">Вариант 1</span>
        </button>
        <button class="ans-btn blue" onclick="selectAnswer(1)">
            <div class="shape-icon">◆</div>
            <span id="opt-1">Вариант 2</span>
        </button>
        <button class="ans-btn yellow" onclick="selectAnswer(2)">
            <div class="shape-icon">●</div>
            <span id="opt-2">Вариант 3</span>
        </button>
        <button class="ans-btn green" onclick="selectAnswer(3)">
            <div class="shape-icon">■</div>
            <span id="opt-3">Вариант 4</span>
        </button>
    </div>
</div>

<!-- 3. ЭКРАН РЕЗУЛЬТАТА ПОСЛЕ КАЖДОГО ВОПРОСА -->
<div class="feedback-overlay" id="feedback-screen">
    <div class="fb-icon" id="fb-icon">🎉</div>
    <h2 class="fb-title" id="fb-title">ВЕРНО!</h2>
    <div class="fb-points" id="fb-points">+950 очков</div>
    <div class="fb-explain" id="fb-explain">Пояснение к задаче</div>
    <button class="btn-next" onclick="nextQuestion()">Дальше →</button>
</div>

<!-- 4. ФИНАЛЬНЫЙ ПОДИУМ -->
<div class="screen podium-screen" id="podium-screen">
    <div class="podium-card">
        <div style="font-size: 54px;">🏆</div>
        <div style="font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px;" id="final-nick">Игрок</div>
        <div class="final-score" id="final-score">0</div>
        <div style="font-weight: 700; color: #46178f;" id="final-rank">Ранг: Мастер логики</div>

        <div class="final-grid">
            <div class="f-box">
                <div class="f-val" id="final-correct">0 / 7</div>
                <div class="f-lbl">Правильных</div>
            </div>
            <div class="f-box">
                <div class="f-val" id="final-accuracy">0%</div>
                <div class="f-lbl">Точность</div>
            </div>
            <div class="f-box">
                <div class="f-val" id="final-streak">0</div>
                <div class="f-lbl">Лучшая серия 🔥</div>
            </div>
        </div>

        <button class="btn-start" style="max-width: 100%;" onclick="location.reload()">Сыграть снова 🔄</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzP6PEgoLG4SX9CyF4sJHtifAM2-hRL8puWnaKUG0dhUCmFBCN9sjk9PWAi8XV0cMee/exec";

    const QUESTIONS = [
        {
            category: "🔢 Числовой ряд",
            text: "Продолжи последовательность:\n2,  6,  12,  20,  30,  ?",
            options: ["38", "40", "42", "44"],
            correct: 2,
            explain: "Разница между числами растёт на 2: +4, +6, +8, +10, значит дальше +12 (30 + 12 = 42)."
        },
        {
            category: "🐌 Классическая логика",
            text: "Улитка ползёт по столбу высотой 10 м. За день +3 м, за ночь −2 м.\nНа какой день она впервые достигнет вершины?",
            options: ["На 10-й день", "На 8-й день", "На 7-й день", "На 9-й день"],
            correct: 1,
            explain: "За 7 суток улитка поднимется на 7 метров, а на 8-й день проползёт оставшиеся 3 метра и сразу окажется на вершине!"
        },
        {
            category: "🎭 Рыцари и лжецы",
            text: "Рыцари всегда говорят правду, лжецы всегда лгут.\nЖитель А сказал: «Мы оба с Б — лжецы». Кто они?",
            options: ["Оба лжецы", "А — рыцарь, Б — лжец", "А — лжец, Б — рыцарь", "Оба рыцари"],
            correct: 2,
            explain: "Рыцарь не может солгать, что он лжец. Значит А — лжец, а его фраза «мы оба лжецы» — ложь. Следовательно, Б — рыцарь."
        },
        {
            category: "🔤 Логика букв",
            text: "Какая буква должна стоять следующей?\nО,  Д,  Т,  Ч,  П,  Ш,  С,  ?",
            options: ["В", "Д", "К", "М"],
            correct: 0,
            explain: "Это первые буквы чисел: Один, Два, Три, Четыре, Пять, Шесть, Семь, Восемь (В)."
        },
        {
            category: "⚖️ Алгоритмы",
            text: "Из 9 одинаковых монет одна фальшивая (легче остальных).\nЗа сколько взвешиваний на весах без гирь её точно можно найти?",
            options: ["За 1", "За 2", "За 3", "За 4"],
            correct: 1,
            explain: "Делим монеты на 3 кучки по 3 штуки: 1-м взвешиванием находим лёгкую тройку, 2-м — лёгкую монету из неё."
        },
        {
            category: "🕒 Часы и углы",
            text: "На часах ровно 3:15.\nЧему равен угол между часовой и минутной стрелками?",
            options: ["0°", "7.5°", "15°", "5°"],
            correct: 1,
            explain: "Минутная стрелка ровно на тройке, а часовая за 15 минут прошла 1/4 пути от 3 к 4 (четверть от 30° = 7.5°)."
        },
        {
            category: "🔐 Шифр",
            text: "Если КОД = 12-16-5,\nто чему равно слово УМ?",
            options: ["20-13", "21-14", "22-15", "19-12"],
            correct: 1,
            explain: "Это порядковые номера букв в русском алфавите: У — 21-я буква, М — 14-я."
        }
    ];

    const QUESTION_TIME_LIMIT = 25; // секунд на один вопрос
    let playerName = "Игрок";
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let streak = 0;
    let bestStreak = 0;
    let questionStartTime = 0;
    let timerInterval = null;
    let answered = false;

    function sendStats(eventName, extraPoints = 0) {
        if (!GOOGLE_SCRIPT_URL) return;
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                playerId: playerName,
                stage: currentIndex + 1,
                event: eventName,
                timeMins: score,
                hints: streak
            })
        }).catch(() => {});
    }

    function startGame() {
        const inputName = document.getElementById("player-name").value.trim();
        playerName = inputName || ("Игрок-" + Math.floor(100 + Math.random() * 900));

        document.getElementById("start-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "flex";
        sendStats("KAHOOT_START");
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = QUESTIONS[currentIndex];

        document.getElementById("hud-step").innerText = `${currentIndex + 1} / ${QUESTIONS.length}`;
        document.getElementById("hud-score").innerText = `🏆 ${score}`;
        document.getElementById("q-category").innerText = q.category;
        document.getElementById("q-text").innerText = q.text;

        for (let i = 0; i < 4; i++) {
            document.getElementById(`opt-${i}`).innerText = q.options[i];
        }

        const streakEl = document.getElementById("hud-streak");
        if (streak > 0) {
            streakEl.style.opacity = "1";
            streakEl.innerText = `🔥 Серия: ${streak}`;
        } else {
            streakEl.style.opacity = "0";
        }

        // Запуск таймера вопроса
        questionStartTime = Date.now();
        const bar = document.getElementById("timer-bar");
        bar.style.width = "100%";
        bar.style.backgroundColor = "#00f5d4";

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const elapsed = (Date.now() - questionStartTime) / 1000;
            const remaining = Math.max(0, QUESTION_TIME_LIMIT - elapsed);
            const pct = (remaining / QUESTION_TIME_LIMIT) * 100;
            bar.style.width = `${pct}%`;

            if (pct < 30) bar.style.backgroundColor = "#ff2a5f";
            else if (pct < 60) bar.style.backgroundColor = "#ffbe0b";

            if (remaining <= 0 && !answered) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 50);
    }

    function selectAnswer(choiceIndex) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const q = QUESTIONS[currentIndex];
        const isCorrect = choiceIndex === q.correct;
        const elapsed = (Date.now() - questionStartTime) / 1000;

        const fbScreen = document.getElementById("feedback-screen");
        fbScreen.className = "feedback-overlay " + (isCorrect ? "correct" : "wrong");
        fbScreen.style.display = "flex";

        if (isCorrect) {
            correctCount++;
            streak++;
            if (streak > bestStreak) bestStreak = streak;

            // Расчёт очков как в Kahoot: базовые + бонус за скорость + бонус за серию
            const speedRatio = Math.max(0.2, 1 - (elapsed / QUESTION_TIME_LIMIT) * 0.5);
            const earned = Math.round(1000 * speedRatio) + (streak > 1 ? streak * 100 : 0);
            score += earned;

            document.getElementById("fb-icon").innerText = "🎉";
            document.getElementById("fb-title").innerText = "ВЕРНО!";
            document.getElementById("fb-points").innerText = `+${earned} очков` + (streak > 1 ? ` (🔥 x${streak})` : "");
            sendStats(`CORRECT (+${earned})`);
        } else {
            streak = 0;
            document.getElementById("fb-icon").innerText = "💥";
            document.getElementById("fb-title").innerText = "НЕВЕРНО!";
            document.getElementById("fb-points").innerText = `Правильный ответ: ${q.options[q.correct]}`;
            sendStats(`WRONG (${q.options[choiceIndex]})`);
        }

        document.getElementById("fb-explain").innerText = q.explain;
    }

    function handleTimeout() {
        answered = true;
        streak = 0;
        const q = QUESTIONS[currentIndex];
        const fbScreen = document.getElementById("feedback-screen");
        fbScreen.className = "feedback-overlay wrong";
        fbScreen.style.display = "flex";

        document.getElementById("fb-icon").innerText = "⏰";
        document.getElementById("fb-title").innerText = "ВРЕМЯ ВЫШЛО!";
        document.getElementById("fb-points").innerText = `Правильный ответ: ${q.options[q.correct]}`;
        document.getElementById("fb-explain").innerText = q.explain;
        sendStats("TIMEOUT");
    }

    function nextQuestion() {
        document.getElementById("feedback-screen").style.display = "none";
        currentIndex++;

        if (currentIndex < QUESTIONS.length) {
            loadQuestion();
        } else {
            showPodium();
        }
    }

    function showPodium() {
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("podium-screen").style.display = "flex";

        const accuracy = Math.round((correctCount / QUESTIONS.length) * 100);
        let rank = "🌱 Новичок логики";
        if (accuracy === 100) rank = "👑 Легенда Logic Arena";
        else if (accuracy >= 70) rank = "🚀 Мастер дедукции";
        else if (accuracy >= 45) rank = "💡 Уверенный аналитик";

        document.getElementById("final-nick").innerText = playerName;
        document.getElementById("final-score").innerText = score.toLocaleString("ru-RU");
        document.getElementById("final-rank").innerText = rank;
        document.getElementById("final-correct").innerText = `${correctCount} / ${QUESTIONS.length}`;
        document.getElementById("final-accuracy").innerText = `${accuracy}%`;
        document.getElementById("final-streak").innerText = bestStreak;

        sendStats(`FINISH: ${score} pts (${correctCount}/${QUESTIONS.length})`);

        if (typeof confetti === "function") {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
    }

    document.getElementById("player-name").addEventListener("keypress", function(e) {
        if (e.key === "Enter") startGame();
    });
</script>

</body>
</html>
