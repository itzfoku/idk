<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LogicQuest — Тренажёр логического мышления</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: gradientBG 12s ease infinite;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.28);
            transition: transform 0.2s ease;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .step-pill {
            background: #eef2ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 999px;
        }
        .timer-pill {
            background: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
        }
        .progress-track {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 26px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #ec4899, #f59e0b);
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .question-desc {
            font-size: 16px;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            line-height: 1.5;
        }
        .task-box {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.55;
            white-space: pre-line;
            margin-bottom: 22px;
        }
        .input-group {
            display: flex;
            gap: 12px;
        }
        input[type="text"] {
            flex: 1;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 15px 18px;
            font-size: 17px;
            font-family: inherit;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 15px 26px;
            font-family: inherit;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.45);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .error-msg {
            color: var(--danger);
            font-weight: 600;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }
        .actions-row {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            gap: 10px;
        }
        .btn-ghost {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: var(--text-muted);
            border-radius: 12px;
            padding: 10px 16px;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ghost:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }
        .hint-box {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
        }
        .shake {
            animation: shakeAnim 0.35s ease;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        /* Экран результатов */
        .result-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .trophy {
            font-size: 56px;
            margin-bottom: 8px;
        }
        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 22px;
            border-radius: 999px;
            margin-top: 8px;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.4);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            padding: 18px;
            border-radius: 18px;
            text-align: center;
        }
        .stat-card.blue { background: #eff6ff; color: #1d4ed8; }
        .stat-card.green { background: #ecfdf5; color: #047857; }
        .stat-card.amber { background: #fffbeb; color: #b45309; }
        .stat-card.purple { background: #f5f3ff; color: #6d28d9; }
        .stat-value {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .stat-name {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.85;
        }
        @media (max-width: 500px) {
            .input-group { flex-direction: column; }
            .card { padding: 22px; }
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="top-bar">
        <div class="step-pill" id="step-counter">Вопрос 1 из 7</div>
        <div class="timer-pill" id="timer">⏱ 00:00</div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div id="game-area">
        <div class="category-badge" id="category-badge">Загрузка...</div>
        <p class="question-desc" id="stage-text"></p>
        <div class="task-box" id="stage-task"></div>

        <div class="input-group">
            <input type="text" id="answer-input" placeholder="Твой ответ..." autocomplete="off">
            <button class="btn-primary" onclick="checkAnswer()">Ответить →</button>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="actions-row">
            <button class="btn-ghost" onclick="toggleHint()">💡 Подсказка</button>
            <button class="btn-ghost" onclick="skipQuestion()">Пропустить ⏭</button>
        </div>
        <div class="hint-box" id="hint-box"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzP6PEgoLG4SX9CyF4sJHtifAM2-hRL8puWnaKUG0dhUCmFBCN9sjk9PWAi8XV0cMee/exec";

    const QUESTIONS = [
        {
            badge: "🔢 Числовой ряд",
            badgeBg: "#e0e7ff",
            badgeColor: "#4338ca",
            text: "Найди закономерность и определи следующее число:",
            task: "2,   6,   12,   20,   30,   ?",
            answers: ["42"],
            hint: "Посмотри на разницу между соседними числами: +4, +6, +8, +10..."
        },
        {
            badge: "🐌 Классическая логика",
            badgeBg: "#dcfce7",
            badgeColor: "#15803d",
            text: "Внимательно прочитай условие задачи:",
            task: "Улитка ползёт вверх по столбу высотой 10 метров. За день она поднимается на 3 метра, а за ночь сползает вниз на 2 метра. На какой по счёту день улитка впервые достигнет вершины?",
            answers: ["8", "ВОСЬМОЙ", "НА 8", "8 ДЕНЬ"],
            hint: "После 7 суток она будет на высоте 7 метров. Сколько ей останется проползти на 8-й день?"
        },
        {
            badge: "🎭 Рыцари и лжецы",
            badgeBg: "#fce7f3",
            badgeColor: "#be185d",
            text: "Рыцари всегда говорят правду, а лжецы всегда лгут. Вы встретили двух жителей острова — А и Б.",
            task: "А сказал: «Мы оба с Б — лжецы».\nКто из них кто? (Напиши два слова через пробел, например: ЛЖЕЦ РЫЦАРЬ)",
            answers: ["ЛЖЕЦ РЫЦАРЬ", "ЛЖЕЦ И РЫЦАРЬ"],
            hint: "Может ли рыцарь назвать себя лжецом? А если А лжёт, значит фраза «мы оба лжецы» — неправда."
        },
        {
            badge: "🔤 Логика букв",
            badgeBg: "#fef3c7",
            badgeColor: "#b45309",
            text: "Определи, какая буква должна стоять следующей в этом ряду:",
            task: "О,   Д,   Т,   Ч,   П,   Ш,   С,   ?",
            answers: ["В"],
            hint: "Это первые буквы числительных: Один, Два, Три, Четыре..."
        },
        {
            badge: "⚖️ Алгоритмы и взвешивание",
            badgeBg: "#f3e8ff",
            badgeColor: "#7e22ce",
            text: "Задача на поиск оптимального решения:",
            task: "Есть 9 внешне одинаковых монет, но одна из них фальшивая (она легче остальных). За какое минимальное число взвешиваний на чашечных весах без гирь можно гарантированно найти фальшивую монету?",
            answers: ["2", "ДВА"],
            hint: "Раздели монеты на три равные кучки по 3 штуки."
        },
        {
            badge: "🕒 Геометрия и время",
            badgeBg: "#ffedd5",
            badgeColor: "#c2410c",
            text: "Представь циферблат механических часов:",
            task: "Часы показывают ровно 3:15. Чему равен угол (в градусах) между часовой и минутной стрелками? (Введи только число)",
            answers: ["7.5", "7,5"],
            hint: "Минутная стрелка стоит ровно на тройке, а часовая за 15 минут прошла 1/4 пути от 3 до 4 (четверть от 30°)."
        },
        {
            badge: "🔐 Финальный шифр",
            badgeBg: "#ccfbf1",
            badgeColor: "#0f766e",
            text: "Примени логику кодирования:",
            task: "Если КОД = 12-16-5, то чему равно слово УМ? (Запиши числа через дефис)",
            answers: ["21-14"],
            hint: "Каждой букве соответствует её порядковый номер в русском алфавите (К=12, О=16, Д=5)."
        }
    ];

    let currentStep = parseInt(localStorage.getItem("lq_step")) || 0;
    let solvedCount = parseInt(localStorage.getItem("lq_solved")) || 0;
    let wrongAttempts = parseInt(localStorage.getItem("lq_wrong")) || 0;
    let hintsUsed = parseInt(localStorage.getItem("lq_hints")) || 0;
    let startTime = parseInt(localStorage.getItem("lq_start")) || Date.now();
    let playerId = localStorage.getItem("lq_id") || ("USER-" + Math.floor(1000 + Math.random() * 9000));

    localStorage.setItem("lq_start", startTime);
    localStorage.setItem("lq_id", playerId);

    function sendStats(eventName) {
        if (!GOOGLE_SCRIPT_URL) return;
        const timeMins = ((Date.now() - startTime) / 60000).toFixed(1);
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                playerId: playerId,
                stage: currentStep + 1,
                event: eventName,
                timeMins: timeMins,
                hints: hintsUsed
            })
        }).catch(() => {});
    }

    if (!localStorage.getItem("lq_started")) {
        sendStats("TEST_START");
        localStorage.setItem("lq_started", "1");
    }

    setInterval(() => {
        if (currentStep >= QUESTIONS.length) return;
        const diff = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
        const secs = String(diff % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `⏱ ${mins}:${secs}`;
    }, 1000);

    function getRank(score, total) {
        const ratio = score / total;
        if (ratio === 1 && hintsUsed === 0) return { title: "🏆 Гений логики (S-ранг)", emoji: "👑" };
        if (ratio >= 0.85) return { title: "🚀 Мастер дедукции (A-ранг)", emoji: "🎉" };
        if (ratio >= 0.55) return { title: "💡 Уверенный аналитик (B-ранг)", emoji: "👏" };
        return { title: "🌱 Начинающий исследователь (C-ранг)", emoji: "✨" };
    }

    function renderStep() {
        const progressPercent = (currentStep / QUESTIONS.length) * 100;
        document.getElementById("progress-fill").style.width = `${progressPercent}%`;

        if (currentStep >= QUESTIONS.length) {
            const totalMins = ((Date.now() - startTime) / 60000).toFixed(1);
            const rank = getRank(solvedCount, QUESTIONS.length);
            document.getElementById("step-counter").innerText = "Финиш!";

            if (typeof confetti === "function") {
                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            }

            document.getElementById("game-area").innerHTML = `
                <div class="result-header">
                    <div class="trophy">${rank.emoji}</div>
                    <h2 style="margin: 0; font-size: 24px;">Тест завершён!</h2>
                    <div class="rank-badge">${rank.title}</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card green">
                        <div class="stat-value">${solvedCount} / ${QUESTIONS.length}</div>
                        <div class="stat-name">Решено задач</div>
                    </div>
                    <div class="stat-card blue">
                        <div class="stat-value">${totalMins} мин</div>
                        <div class="stat-name">Время прохождения</div>
                    </div>
                    <div class="stat-card amber">
                        <div class="stat-value">${hintsUsed}</div>
                        <div class="stat-name">Подсказок взято</div>
                    </div>
                    <div class="stat-card purple">
                        <div class="stat-value">${wrongAttempts}</div>
                        <div class="stat-name">Ошибок</div>
                    </div>
                </div>

                <div style="text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 16px;">
                    ID участника: ${playerId}
                </div>

                <button class="btn-primary" style="width: 100%;" onclick="resetTest()">🔄 Пройти ещё раз</button>
            `;
            return;
        }

        const q = QUESTIONS[currentStep];
        document.getElementById("step-counter").innerText = `Вопрос ${currentStep + 1} из ${QUESTIONS.length}`;

        const badge = document.getElementById("category-badge");
        badge.innerText = q.badge;
        badge.style.background = q.badgeBg;
        badge.style.color = q.badgeColor;

        document.getElementById("stage-text").innerText = q.text;
        document.getElementById("stage-task").innerText = q.task;
        document.getElementById("hint-box").innerText = "💡 " + q.hint;
        document.getElementById("hint-box").style.display = "none";
        document.getElementById("answer-input").value = "";
        document.getElementById("error-msg").innerText = "";
    }

    function checkAnswer() {
        const inputEl = document.getElementById("answer-input");
        const input = inputEl.value.trim().toUpperCase();
        if (!input) return;

        const validAnswers = QUESTIONS[currentStep].answers.map(a => a.toUpperCase());

        if (validAnswers.includes(input)) {
            solvedCount++;
            localStorage.setItem("lq_solved", solvedCount);
            sendStats("SOLVED");
            nextStep();
        } else {
            wrongAttempts++;
            localStorage.setItem("lq_wrong", wrongAttempts);
            sendStats("WRONG: " + input);
            document.getElementById("error-msg").innerText = "❌ Неверно! Подумай ещё или открой подсказку.";

            const card = document.getElementById("main-card");
            card.classList.remove("shake");
            void card.offsetWidth;
            card.classList.add("shake");
        }
    }

    function skipQuestion() {
        sendStats("SKIPPED");
        nextStep();
    }

    function nextStep() {
        currentStep++;
        localStorage.setItem("lq_step", currentStep);
        if (currentStep >= QUESTIONS.length) {
            sendStats(`FINISHED (${solvedCount}/${QUESTIONS.length})`);
        }
        renderStep();
    }

    function toggleHint() {
        const box = document.getElementById("hint-box");
        if (box.style.display === "none") {
            box.style.display = "block";
            hintsUsed++;
            localStorage.setItem("lq_hints", hintsUsed);
            sendStats("HINT_USED");
        }
    }

    function resetTest() {
        localStorage.clear();
        location.reload();
    }

    document.getElementById("answer-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") checkAnswer();
    });

    renderStep();
</script>

</body>
</html>
